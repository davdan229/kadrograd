name: Build and publish
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kadrograd-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Test and build
        run: |
          chmod +x gradlew
          ./gradlew :Kadrograd:testDebugUnitTest :Kadrograd:make makePluginsJson --console=plain
          python3 scripts/package_repo.py
      - name: Publish repository files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha > /tmp/kadrograd-main
          if [ "$(cat /tmp/kadrograd-main)" != "$GITHUB_SHA" ]; then
            echo "A newer main revision exists; publication skipped."
            exit 0
          fi
          git fetch origin builds || true
          if git show-ref --verify --quiet refs/remotes/origin/builds; then
            git worktree add --detach publish origin/builds
          else
            mkdir publish
            git -C publish init -b builds
          fi
          cp dist/* publish/
          cd publish
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish $GITHUB_SHA"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:builds
