name: Refresh verified 4K catalog
on:
  schedule:
    - cron: '47 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kadrograd-uhd-catalog
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
      - name: Read previous catalog
        run: |
          if git ls-remote --exit-code origin refs/heads/uhd-catalog; then
            git fetch origin uhd-catalog
            git worktree add --detach verified-catalog FETCH_HEAD
          else
            mkdir verified-catalog
            git -C verified-catalog init -b uhd-catalog
          fi
      - name: Check new releases and continue the catalog
        env:
          KADROGRAD_UHD_OUTPUT: ${{ github.workspace }}/verified-catalog/catalog.json
        run: |
          chmod +x gradlew
          ./gradlew :Kadrograd:testDebugUnitTest -PliveSources --tests '*UhdCatalogCheck' --console=plain
      - name: Publish verified identities
        working-directory: verified-catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -f catalog.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh confirmed UHD availability"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:uhd-catalog
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: uhd-catalog-report
          path: Kadrograd/build/test-results/testDebugUnitTest/TEST-ru.kadrograd.UhdCatalogCheck.xml
          if-no-files-found: ignore
          retention-days: 5
