name: Android client
on:
  push:
    branches: [client-downloads]
    paths: ['client/**', 'Kadrograd/**', '.github/workflows/client.yml']
  workflow_dispatch:
    inputs:
      reuse_run:
        description: 'Recheck an existing signed APK from this workflow run ID'
        required: false
        type: string
      refresh_extension:
        description: 'Re-sign the existing APK with the extension from this revision'
        required: false
        type: boolean
        default: false
      rebuild_tests:
        description: 'Compile updated device checks against the unchanged signed APK'
        required: false
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: kadrograd-client-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: recloudstream/cloudstream
          ref: 3796406e636356f556c16e04e1da4e37d6a19038
          path: .client-work/upstream
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: client/upstream.json
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
      - name: Validate reusable app revision
        if: inputs.reuse_run != '' && (inputs.refresh_extension || inputs.rebuild_tests)
        env:
          GH_TOKEN: ${{ github.token }}
          REUSE_RUN: ${{ inputs.reuse_run }}
        run: |
          previous_sha="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REUSE_RUN" --jq .head_sha)"
          git fetch --no-tags origin "$previous_sha"
          if ! git diff --quiet "$previous_sha" HEAD -- client/overlay/app/src/main client/prepare.py client/upstream.json client/signing-cert.pem; then
            echo "Client code changed. Build a new APK instead of refreshing its assets."
            exit 1
          fi
      - name: Fetch existing signed APK for device checks
        if: inputs.reuse_run != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.reuse_run }}
          name: kadrograd-client-checks
          path: .client-work/upstream
      - name: Prepare pinned client source
        if: inputs.reuse_run == '' || inputs.rebuild_tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y ffmpeg
          python3 client/prepare.py .client-work/upstream
          python3 client/make_test_media.py .client-work/upstream/app/src/androidTest/assets/adaptive
      - name: Build and bundle extension
        if: inputs.reuse_run == '' || inputs.refresh_extension
        run: |
          chmod +x gradlew
          ./gradlew :Kadrograd:testDebugUnitTest :Kadrograd:make makePluginsJson --console=plain --max-workers=2
          python3 -m unittest discover -s scripts -p 'test_package_repo.py'
          python3 scripts/package_repo.py
          python3 client/bundle_sources.py .client-work/upstream
          ./gradlew --stop
      - name: Build Android client and tests
        if: inputs.reuse_run == '' || inputs.rebuild_tests
        working-directory: .client-work/upstream
        env:
          KADROGRAD_SIGNING_STORE: ${{ secrets.KADROGRAD_SIGNING_STORE }}
          KADROGRAD_SIGNING_PASSWORD: ${{ secrets.KADROGRAD_SIGNING_PASSWORD }}
          REUSE_RUN: ${{ inputs.reuse_run }}
        run: |
          export KADROGRAD_SIGNING_STORE_PATH="$RUNNER_TEMP/kadrograd-signing.p12"
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          key = os.environ['KADROGRAD_SIGNING_STORE']
          assert key, 'APK signing key is not configured'
          path = Path(os.environ['KADROGRAD_SIGNING_STORE_PATH'])
          path.write_bytes(base64.b64decode(key, validate=True))
          path.chmod(0o600)
          PY
          trap 'rm -f "$KADROGRAD_SIGNING_STORE_PATH"' EXIT
          chmod +x gradlew
          if [ -n "$REUSE_RUN" ]; then
            sha256sum app/build/outputs/apk/stable/release/app-stable-release.apk > "$RUNNER_TEMP/reused-apk.sha256"
          fi
          tasks=(:app:assembleStableReleaseAndroidTest :app:testStableReleaseUnitTest)
          if [ -z "$REUSE_RUN" ]; then tasks+=(:app:assembleStableRelease); fi
          ./gradlew "${tasks[@]}" -PkadrogradTestBuildType=release --console=plain --max-workers=2 -Dorg.gradle.jvmargs=-Xmx3g -Pkotlin.compiler.execution.strategy=in-process
          if [ -n "$REUSE_RUN" ]; then sha256sum --check "$RUNNER_TEMP/reused-apk.sha256"; fi
          ./gradlew --stop
      - name: Verify APK identity and signature
        run: |
          sdkmanager 'build-tools;35.0.0' > /dev/null
          python3 client/verify_apk.py .client-work/upstream/app/build/outputs/apk/stable/release/app-stable-release.apk
      - name: Refresh and sign the bundled extension
        if: inputs.reuse_run != '' && inputs.refresh_extension
        env:
          KADROGRAD_SIGNING_STORE: ${{ secrets.KADROGRAD_SIGNING_STORE }}
          KADROGRAD_SIGNING_PASSWORD: ${{ secrets.KADROGRAD_SIGNING_PASSWORD }}
        run: |
          export KADROGRAD_SIGNING_STORE_PATH="$RUNNER_TEMP/kadrograd-signing.p12"
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          path = Path(os.environ['KADROGRAD_SIGNING_STORE_PATH'])
          path.write_bytes(base64.b64decode(os.environ['KADROGRAD_SIGNING_STORE'], validate=True))
          path.chmod(0o600)
          PY
          trap 'rm -f "$KADROGRAD_SIGNING_STORE_PATH"' EXIT
          apk=.client-work/upstream/app/build/outputs/apk/stable/release/app-stable-release.apk
          python3 client/refresh_bundle.py "$apk" .client-work/upstream/app/src/main/assets/kadrograd "$RUNNER_TEMP/client-unsigned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -P 16 -f 4 "$RUNNER_TEMP/client-unsigned.apk" "$RUNNER_TEMP/client-aligned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$KADROGRAD_SIGNING_STORE_PATH" --ks-key-alias kadrograd --ks-pass env:KADROGRAD_SIGNING_PASSWORD --out "$apk" "$RUNNER_TEMP/client-aligned.apk"
          python3 client/verify_apk.py "$apk"
      - name: Verify adaptive downloads on Android
        timeout-minutes: 12
        env:
          KADROGRAD_UPGRADE_FROM: https://github.com/davdan229/kadrograd/releases/download/client-v1.0.0-beta.1/CloudStream-Kadrograd-1.0.0-beta.1.apk
          KADROGRAD_UPGRADE_SHA256: da84158d04f396afb3c6765137fdf0ee7a4c81f1b542d4f30cf393e9765a3a09
        run: bash client/run_android_checks.sh .client-work/upstream
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: kadrograd-client-checks
          path: |
            .client-work/upstream/app/build/outputs/apk/
            .client-work/upstream/app/build/reports/tests/
            .client-work/upstream/android-checks/
          if-no-files-found: ignore
          retention-days: 5
