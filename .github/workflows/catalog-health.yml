name: Catalog health
on:
  schedule:
    - cron: '23 6 * * 2,5'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kadrograd-catalog-health
  cancel-in-progress: false
jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805da76410c181273ba90b1
      - name: Check a bounded sample
        run: python3 scripts/check_catalog_health.py
